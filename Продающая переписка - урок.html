px\">Лучший вариант — заранее договориться о следующем контакте.<\u002Fp>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 18px\">\n    <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n      <div style=\"max-width:92%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n        <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n        <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Вы обсудите предложение с руководителем в четверг. Тогда я напишу вам в пятницу до обеда, хорошо?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 18px\">Если срок не согласован, частоту касаний выбирают с учетом скорости сделки: для срочного входящего запроса можно вернуться через несколько часов или на следующий день, для сложной услуги решение может занимать несколько дней.<\u002Fp>\n\n  <div style=\"break-inside:avoid;border:1px solid #E6CDC3;background:#FBF1EC;border-radius:14px;padding:16px 18px;margin:0 0 18px\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#A8401F;margin:0 0 10px\">✕ КАСАНИЯ БЕЗ ПРИЧИНЫ<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.4;color:#3A2C26;margin:0\">«Получилось посмотреть?»<\u002Fp>\n      <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.4;color:#3A2C26;margin:0\">«Есть решение?»<\u002Fp>\n      <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.4;color:#3A2C26;margin:0\">«Напоминаю о себе».<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 18px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n      <span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#5A3826\"><\u002Fspan>\n      <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#8A857A\">ПОЛЕЗНЫЕ КАСАНИЯ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР · ПЕРВОЕ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Отправляю фотографию сервировки с мероприятия на семьдесят пять гостей. Там использован тот же формат без рассадки, который мы обсуждали. По расстоянию между столами можно оценить, сколько места потребуется на вашей площадке.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР · СЛЕДУЮЩЕЕ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Проверил загрузку команды: ваша дата пока свободна до пятницы. Если решение еще не принято, могу сохранить расчет без бронирования, но гарантировать доступность команды после пятницы не смогу.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid;background:#2A1A12;border-radius:16px;padding:20px 22px;margin:0\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#C9A88F;margin:0 0 10px\">ГРАНИЦЫ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.5;color:#F4EDE4;margin:0 0 10px\">Ограничение должно быть реальным. Нельзя придумывать дефицит, несуществующих покупателей или вымышленный срок действия цены.<\u002Fp>\n    <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.5;color:#F4EDE4;margin:0\">Если клиент просит больше не писать, переписку нужно прекратить.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">СКВОЗНОЙ ПРИМЕР<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">все этапы в одном диалоге<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 18px\">Переписка целиком<\u002Fh2>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n\n      <sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"break-inside:avoid;display:flex;align-items:center;gap:10px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488\">ПРИВЕТСТВИЕ И ОТВЕТ НА ВОПРОС<\u002Fspan><span style=\"flex:1;height:1px;background:#DCD3C2\"><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:86%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Здравствуйте. Сколько будет стоить фуршет на корпоратив?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Здравствуйте! Стоимость зависит от числа гостей, меню и необходимости в обслуживании. Фуршет без официантов начинается от 2500 рублей на человека. Чтобы рассчитать ваш вариант, уточните, пожалуйста, сколько будет гостей и на какую дату планируется мероприятие.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"break-inside:avoid;display:flex;align-items:center;gap:10px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488\">КВАЛИФИКАЦИЯ, ПРОГРАММИРОВАНИЕ и ВЫЯВЛЕНИЕ ПОТРЕБНОСТИ В ОДНОМ СООБЩЕНИИ!&nbsp;<\u002Fspan><span style=\"flex:1;height:1px;background:#DCD3C2\"><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:76%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Примерно семьдесят человек, 18 октября.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Спасибо. На эту дату команда свободна. Чтобы предложить подходящий формат, уточню еще два момента: <br>1) нужна ли рассадка и есть ли ограничение по бюджету на одного гостя? <br>2) Это будет легкий фуршет перед основной программой или гости должны полноценно поесть? <br>После этого подберу для вас наиболее подходящий вариант.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"break-inside:avoid;display:flex;align-items:center;gap:10px\"><\u002Fdiv><\u002Fsc-if>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:86%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Рассадка не нужна. Хотелось бы уложиться примерно в 3000 рублей на человека.&nbsp;<br>Должны поесть. Все придут после работы.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        \n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        \n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"break-inside:avoid;display:flex;align-items:center;gap:10px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488\">РЕЗЮМИРОВАНИЕ<\u002Fspan><span style=\"flex:1;height:1px;background:#DCD3C2\"><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Тогда получается: 18 октября, 70 гостей, формат без рассадки, но меню должно заменить полноценный ужин. Бюджет — около 3000 рублей на человека. Все верно?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:56%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Да.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"break-inside:avoid;display:flex;align-items:center;gap:10px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488\">ПРЕЗЕНТАЦИЯ И ПОПЫТКА СДЕЛКИ<\u002Fspan><span style=\"flex:1;height:1px;background:#DCD3C2\"><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#3A2318;border:1px solid #3A2318;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#C9A88F;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#FFFFFF\">Предлагаю меню с холодными закусками, двумя горячими позициями и порционными десертами. Все блюда можно есть без полноценной сервировки. В стоимость включены доставка, посуда и работа двух официантов. Итоговая сумма — 196 000 рублей. Если вариант подходит, сегодня зафиксируем дату и отправим договор, бронирование даты по предварительной оплате 30%- это 58 800руб. Бронируем?<br>*Отправлен файл с фотографиями позиций меню и составом*<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"break-inside:avoid;display:flex;align-items:center;gap:10px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488\">СОМНЕНИЕ И ПОВТОРНАЯ ПОПЫТКА<\u002Fspan><span style=\"flex:1;height:1px;background:#DCD3C2\"><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:80%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Дороже, чем рассчитывали. Я подумаю.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Конечно. Уточню, чтобы помочь сориентироваться: вы хотите сравнить общую стоимость или решить, нужны ли дополнительные позиции и обслуживание?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:80%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Скорее не уверены насчет двух официантов.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#3A2318;border:1px solid #3A2318;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#C9A88F;margin:0 0 6px\">МЕНЕДЖЕР · отработка возражения<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#FFFFFF\">Понимаю. Два сотрудника нужны, чтобы одновременно пополнять обе линии и убирать использованную посуду. Можно оставить одного официанта, если представитель вашей команды сможет следить за второй зоной. Тогда стоимость снизится до 181 000 рублей. Зафиксировать в расчете этот вариант?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:60%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Да, пришлите.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Хорошо. Сейчас обновлю расчет и отправлю его вместе с договором. После этого останется проверить реквизиты и внести предоплату 30%- это будет 54 300руб для бронирования даты.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showPrinciple }}\" hint-placeholder-val=\"{{ true }}\">\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ИТОГ<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">главный принцип<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Последовательность небольших решений<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 20px\">Продающая переписка — это не одно идеальное сообщение, которое должно немедленно убедить клиента купить.<\u002Fp>\n\n  <div style=\"break-inside:avoid;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 22px\">\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:16px\"><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.3\">Согласился ответить на вопрос<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:16px\"><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.3\">Подтвердил, что задачу поняли верно<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:16px\"><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.3\">Рассмотрел подходящее предложение<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#3A2318;border:1px solid #3A2318;border-radius:12px;padding:16px\"><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#FFFFFF;line-height:1.3\">Выбрал вариант и совершил действие<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid;background:#2A1A12;border-radius:16px;padding:22px 24px;margin:0\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#C9A88F;margin:0 0 14px\">ДВА ВОПРОСА К КАЖДОМУ СООБЩЕНИЮ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:24pt;line-height:1.4;color:#FFFFFF;margin:0 0 8px\">Какую задачу решает это сообщение?<\u002Fp>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:24pt;line-height:1.4;color:#FFFFFF;margin:0 0 14px\">Что клиент должен сделать после него?<\u002Fp>\n    <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.5;color:#C6B8AB;margin:0\">Если на эти вопросы нет ясного ответа, сообщение, скорее всего, перегружено или не продвигает продажу.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fdoc-page>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showStageMap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Состав урока&quot;},&quot;showAnnotations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Состав урока&quot;},&quot;showPrinciple&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Состав урока&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const p = this.props;\n    return {\n      showStageMap: p.showStageMap ?? true,\n      showAnnotations: p.showAnnotations ?? true,\n      showPrinciple: p.showPrinciple ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
