document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  doc-page:not(:defined){visibility:hidden}\n  body{margin:0}\n  a{color:#5A3826}\n  a:hover{color:#3A2318}\n<\u002Fstyle>\n<script src=\"d43265ce-fa36-4bca-81dc-a74ce259e2a7\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page size=\"a4\" margin=\"15mm\">\n\n<div slot=\"footer\" style=\"display:flex;justify-content:space-between;align-items:center;font-family:Onest,sans-serif;font-size:20pt;color:#9A9488;border-top:1px solid #E2DCCE;padding-top:7px\">\n  \n  \n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:center;gap:12px;margin:0 0 18px\">\n  \n  <span style=\"overflow-wrap: break-word; font-family: Onest,sans-serif; font-size: 13pt; font-weight: 700; letter-spacing: 0.05em; color: #5A3826\">АНО ДПО \"Стратегия роста\"&nbsp;<br><\u002Fspan>\n<\u002Fdiv>\n\n<h1 style=\"font-family:Onest,sans-serif;font-size:42pt;line-height:1.08;font-weight:800;letter-spacing:-0.03em;color:#2A1A12;margin:0 0 18px;text-wrap:balance\">Логика продающей переписки: как провести клиента от первого сообщения до сделки<\u002Fh1>\n\n\n\n<div style=\"break-inside:avoid;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#E2DCCE;border:1px solid #E2DCCE;border-radius:14px;overflow:hidden;margin:0 0 26px\">\n  <div style=\"background:#F7F4EE;padding:16px 18px\">\n    <div style=\"font-family:Onest,sans-serif;font-size:30pt;font-weight:800;color:#5A3826;line-height:1\">9<\u002Fdiv>\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#6E6A60;margin-top:4px;line-height:1.3\">этапов продажи<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#F7F4EE;padding:16px 18px\">\n    <div style=\"font-family:Onest,sans-serif;font-size:30pt;font-weight:800;color:#5A3826;line-height:1\">3<\u002Fdiv>\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#6E6A60;margin-top:4px;line-height:1.3\">части сообщения<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#F7F4EE;padding:16px 18px\">\n    <div style=\"font-family:Onest,sans-serif;font-size:30pt;font-weight:800;color:#5A3826;line-height:1\">1<\u002Fdiv>\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#6E6A60;margin-top:4px;line-height:1.3\">шаг в конце<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 14px\">Главная ошибка менеджера — пытаться продать все сразу. Он отправляет большое сообщение, в котором одновременно рассказывает о компании, перечисляет преимущества, задает пять вопросов, называет цену и предлагает оплатить. Клиенту приходится разбираться во всем этом самому, поэтому он откладывает ответ или исчезает.<\u002Fp>\n\n<p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 22px\">В хорошей переписке каждое сообщение решает одну понятную задачу и заканчивается следующим шагом. Менеджер не вываливает на клиента всю информацию, а последовательно проводит его через этапы продажи.<\u002Fp>\n\n<sc-if value=\"{{ showStageMap }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"break-inside:avoid;margin:0 0 20px\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 16px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">КАРТА УРОКА<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">путь клиента по этапам<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826;letter-spacing:0.04em\">01<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.25;margin-top:4px\">Приветствие<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826;letter-spacing:0.04em\">02<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.25;margin-top:4px\">Объяснение логики разговора<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826;letter-spacing:0.04em\">03<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.25;margin-top:4px\">Квалификация<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826;letter-spacing:0.04em\">04<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.25;margin-top:4px\">Выявление потребности<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826;letter-spacing:0.04em\">05<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.25;margin-top:4px\">Резюмирование<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826;letter-spacing:0.04em\">06<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.25;margin-top:4px\">Презентация<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826;letter-spacing:0.04em\">07<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.25;margin-top:4px\">Попытка сделки<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826;letter-spacing:0.04em\">08<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#22242A;line-height:1.25;margin-top:4px\">Отработка возражений<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#3A2318;border:1px solid #3A2318;border-radius:12px;padding:14px 16px;grid-column:1 / -1\"><div style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#C9A88F;letter-spacing:0.04em\">09<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;color:#FFFFFF;line-height:1.25;margin-top:4px\">Повторная попытка сделки<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"break-inside:avoid;background:#2A1A12;border-radius:16px;padding:20px 22px;margin:0 0 6px\">\n  <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#C9A88F;margin:0 0 10px\">ВАЖНО<\u002Fdiv>\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.5;color:#F4EDE4;margin:0\">Не каждый этап требует отдельного сообщения — некоторые можно и нужно объединять. Например, в первом ответе можно поздороваться, ответить на вопрос клиента, объяснить, зачем потребуется уточнение, и задать сразу до 3 вопросов, которые помогут сориентироваться и предварительно предложить решение.&nbsp;<\u002Fp>\n<\u002Fdiv>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">КОНСТРУКЦИЯ<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">одно сообщение — одна задача<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Из чего состоит одно продающее сообщение<\u002Fh2>\n\n  <div style=\"break-inside:avoid;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 20px\">\n    <div style=\"background:#FFFFFF;border:2px solid #2A1A12;border-radius:14px;padding:16px 18px\">\n      <div style=\"font-family:Onest,sans-serif;font-size:26pt;font-weight:800;color:#5A3826;line-height:1;margin:0 0 8px\">1<\u002Fdiv>\n      <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;line-height:1.3;color:#22242A\">Ответить на то, что написал клиент<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:2px solid #2A1A12;border-radius:14px;padding:16px 18px\">\n      <div style=\"font-family:Onest,sans-serif;font-size:26pt;font-weight:800;color:#5A3826;line-height:1;margin:0 0 8px\">2<\u002Fdiv>\n      <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;line-height:1.3;color:#22242A\">Дать только ту информацию, которая помогает принять решение сейчас<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:2px solid #2A1A12;border-radius:14px;padding:16px 18px;grid-column:1 / -1\">\n      <div style=\"font-family:Onest,sans-serif;font-size:26pt;font-weight:800;color:#5A3826;line-height:1;margin:0 0 8px\">3<\u002Fdiv>\n      <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:600;line-height:1.3;color:#22242A\">Предложить одно конкретное действие: ответить на вопрос, выбрать вариант, назначить встречу, получить расчет или оформить заказ<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 16px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n      <span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#5A3826\"><\u002Fspan>\n      <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#8A857A\">ЗАПРОС КЛИЕНТА<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n      <div style=\"max-width:88%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n        <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n        <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Сколько стоит организовать фуршет на корпоратив?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid;border:1px solid #E6CDC3;background:#FBF1EC;border-radius:14px;padding:16px 18px;margin:0 0 8px\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#A8401F;margin:0 0 8px\">✕ СЛАБЫЙ ОТВЕТ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#3A2C26;margin:0\">«Здравствуйте! Наша компания уже десять лет занимается организацией мероприятий. У нас профессиональная команда, большой выбор блюд, индивидуальный подход и доступные цены. Оставьте номер телефона, и менеджер вам перезвонит».<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"overflow-wrap: break-word; font-family: Literata,Georgia,serif; font-size: 20pt; line-height: 1.55; color: #000000; margin: 0 0 18px\">Клиент не получил ответа на свой вопрос и не понимает, зачем ему переходить в другой канал.<\u002Fp>\n\n  <div style=\"break-inside:avoid;border:1px solid #DCC9B8;background:#F3E9E0;border-radius:14px;padding:16px 18px;margin:0 0 8px\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#5A3826;margin:0 0 8px\">✓ РАБОЧИЙ ОТВЕТ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14;margin:0\">«Здравствуйте! Стоимость зависит от количества гостей, состава меню и необходимости в официантах. Например, фуршет без обслуживания начинается от 2500 рублей на человека. Чтобы рассчитать ваш вариант, уточните, пожалуйста, сколько будет гостей и на какую дату запланировано мероприятие».<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.55;color:#6E6A60;margin:0\">Менеджер ответил на вопрос, объяснил условия расчета и предложил понятный следующий шаг.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 01<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">приветствие<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Первое сообщение<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 16px\">Первое сообщение должно снизить неопределенность. Клиенту необходимо быстро понять три вещи:<\u002Fp>\n\n  <div style=\"break-inside:avoid;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px\">\n    <div style=\"background:#3A2318;border-radius:12px;padding:16px\"><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#FFFFFF;line-height:1.25\">Ему ответили по существу<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#3A2318;border-radius:12px;padding:16px\"><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#FFFFFF;line-height:1.25\">Его запросом готовы заниматься<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#3A2318;border-radius:12px;padding:16px\"><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#FFFFFF;line-height:1.25\">От него требуется простое действие<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 18px\">Если клиент уже задал конкретный вопрос, сначала нужно ответить на него. Нельзя игнорировать вопрос о цене, сроках или наличии и сразу начинать «выявлять потребность».<\u002Fp>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 16px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n      <span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#5A3826\"><\u002Fspan>\n      <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#8A857A\">КОНКРЕТНЫЙ ВОПРОС<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:88%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Вы можете организовать кофе-брейк на восемьдесят человек в следующую пятницу?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:90%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Здравствуйте! Да, работаем с мероприятиями такого масштаба. Чтобы проверить загрузку команды и сразу предложить подходящий формат, уточните, пожалуйста, время начала и адрес площадки.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.55;color:#6E6A60;margin:14px 0 0\">В сообщении нет длинной презентации: менеджер подтверждает возможность, объясняет следующий шаг и задает один содержательный вопрос.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n      <span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#5A3826\"><\u002Fspan>\n      <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#8A857A\">РАЗМЫТЫЙ ЗАПРОС<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:70%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Здравствуйте. Можно подробнее?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:90%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Здравствуйте! Конечно. Подскажите, вы планируете частное мероприятие или корпоратив? Тогда я сразу расскажу о подходящих форматах и стоимости.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 02<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">логика разговора<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Программирование разговора<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 14px\">Программирование означает, что менеджер заранее объясняет клиенту, какие вопросы задаст и какой результат тот получит.<\u002Fp>\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 18px\">Без этого уточняющие вопросы могут восприниматься как допрос. Особенно если клиент хотел узнать цену, а вместо нее получил анкету.<\u002Fp>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 18px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n      <span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#5A3826\"><\u002Fspan>\n      <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#8A857A\">РАБОЧАЯ ФОРМУЛИРОВКА<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n      <div style=\"max-width:92%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n        <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n        <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Чтобы не предлагать вам случайный набор, я уточню количество гостей, формат мероприятия и ограничения по площадке. После этого предложу два варианта меню с итоговой стоимостью.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid;background:#2A1A12;border-radius:16px;padding:20px 22px;margin:0\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#C9A88F;margin:0 0 10px\">ГЛАВНОЕ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.5;color:#F4EDE4;margin:0\">Программирование должно содержать не обещание абстрактной «консультации», а конкретный результат: расчет, подбор решения, проверку возможности или два подходящих варианта.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 03<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">квалификация<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Можем ли мы вообще выполнить запрос<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 18px\">На этапе квалификации выясняются обязательные условия:<\u002Fp>\n\n  <div style=\"break-inside:avoid;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 20px\">\n    <div style=\"display:flex;align-items:center;gap:12px;background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:12px 16px\"><span style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826\">01<\u002Fspan><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Дата<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:12px 16px\"><span style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826\">02<\u002Fspan><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Территория работы<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:12px 16px\"><span style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826\">03<\u002Fspan><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Объем заказа<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:12px 16px\"><span style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826\">04<\u002Fspan><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Бюджетные ограничения<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:12px 16px\"><span style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826\">05<\u002Fspan><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Технические требования<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:12px 16px\"><span style=\"font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#5A3826\">06<\u002Fspan><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Полномочия собеседника<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 18px\">Квалификация нужна не для того, чтобы оценивать, «хороший» перед нами клиент или «плохой». Она помогает не тратить время обеих сторон на заведомо неподходящее решение. Например, кейтеринговая компания работает с заказами от пятидесяти гостей — этот параметр следует выяснить до составления меню.<\u002Fp>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 18px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:92%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР · ОГРАНИЧЕНИЕ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">На сколько гостей планируется мероприятие? Спрашиваю, потому что выездной формат мы организуем для групп от пятидесяти человек.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:92%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР · ОТКАЗ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">На эту дату выездная команды уже заняты, поэтому сразу подтвердить обслуживание мероприятия мы не сможем. Я уточню у всех ли подтвердились мероприятия и напишу вам.&nbsp;<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0\">Если компания не может выполнить запрос, об этом нужно сказать прямо и сразу, а не тянуть время. Если есть хотя бы потенциальная возможность - оповестить клиента об это м и уточнить ее.&nbsp;&nbsp;<\u002Fp>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 04<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">выявление потребности<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Какой результат требуется клиенту<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 16px\">Когда мы убедились, что запрос нам подходит, выясняем текущую ситуацию, желаемый результат, критерии выбора и ограничения.<\u002Fp>\n\n  <div style=\"break-inside:avoid;border:1px solid #E6CDC3;background:#FBF1EC;border-radius:14px;padding:16px 18px;margin:0 0 18px\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#A8401F;margin:0 0 8px\">✕ НЕ ДЕЛАЙТЕ ТАК<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#3A2C26;margin:0\">Не задавайте все вопросы одним большим списком со сложными открытыми вопросами. В переписке человек должен иметь возможность отвечать коротко. ДО 3 ВОПРОСОВ, максимум 1 открытый вопрос.&nbsp;<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 16px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n      <span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#5A3826\"><\u002Fspan>\n      <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#8A857A\">ОДИН ВОПРОС → УТОЧНЕНИЕ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:92%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Какой формат вы рассматриваете: гости свободно подходят к закускам или нужна полноценная рассадка с обслуживанием?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:88%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Скорее свободный формат. Люди будут общаться и перемещаться.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:92%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Тогда уточню, что для вас важнее: сделать меню максимально разнообразным, добавить изысканные позиции с морепродуктами, например, без особого уклона в сытность фуршета или просто сытно накормить гостей с красивой подачей блюд?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.55;color:#6E6A60;margin:14px 0 0\">Так менеджер получает не просто сведения о мероприятии, а критерий решения.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid;background:#2A1A12;border-radius:16px;padding:20px 22px;margin:0\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#C9A88F;margin:0 0 10px\">ПРОВЕРКА ВОПРОСА<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.5;color:#F4EDE4;margin:0\">Если ответ никак не изменит состав продукта, цену, формат или дальнейший шаг, вопрос, скорее всего, лишний.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ПРИЕМ<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">как не превратить переписку в анкетирование<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Показывайте, как вы поняли ответ<\u002Fh2>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 16px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:90%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Будет около семидесяти человек, большинство придет после рабочего дня. Хотим, чтобы люди могли нормально поесть, но официального банкета не будет.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:92%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Понял: нужен не легкий кофе-брейк, а сытный фуршет без рассадки. Тогда рассмотрим меню с горячими закусками и порционными блюдами.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0\">Клиент видит, что его ответ используется. Разговор перестает напоминать заполнение формы.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 05<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">резюмирование<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Соберите требования в одну картину<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 18px\">Перед презентацией нужно кратко собрать требования клиента. Это позволяет проверить, правильно ли мы поняли задачу, и подготовить логичный переход к предложению.<\u002Fp>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 18px\">\n    <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n      <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n        <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n        <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Подведу итог. Мероприятие пройдет 18 октября, ожидается около семидесяти гостей. Нужен сытный фуршет без рассадки, включая несколько вегетарианских позиций. Площадка предоставляет мебель, но необходимы посуда, текстиль и два официанта. Желательный бюджет — до 3000 рублей на человека. Все верно?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0\">\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:14px;padding:16px 18px\">\n      <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#5A3826;margin:0 0 8px\">ПОДТВЕРДИЛ<\u002Fdiv>\n      <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.4;color:#22242A;margin:0\">Презентация воспринимается как ответ на его запрос<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:14px;padding:16px 18px\">\n      <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#5A3826;margin:0 0 8px\">ИСПРАВИЛ<\u002Fdiv>\n      <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.4;color:#22242A;margin:0\">Ошибку можно устранить до расчета<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 06<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">презентация<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Презентация предложения<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 18px\">Презентация в переписке — это не полный рассказ о продукте. Мы берем только те характеристики, которые отвечают потребностям конкретного клиента.<\u002Fp>\n\n  <div style=\"break-inside:avoid;border:1px solid #E6CDC3;background:#FBF1EC;border-radius:14px;padding:16px 18px;margin:0 0 8px\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#A8401F;margin:0 0 8px\">✕ СЛАБАЯ ПРЕЗЕНТАЦИЯ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#3A2C26;margin:0\">«У нас большой выбор блюд, профессиональные повара, индивидуальный подход, качественные продукты и опытные официанты».<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.55;color:#6E6A60;margin:0 0 18px\">Такие формулировки можно отправить практически любому человеку. Они не показывают, почему предложение подходит именно этому клиенту.<\u002Fp>\n\n  <div style=\"break-inside:avoid;border:1px solid #DCC9B8;background:#F3E9E0;border-radius:14px;padding:16px 18px;margin:0 0 8px\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#5A3826;margin:0 0 8px\">✓ РАБОЧАЯ ПРЕЗЕНТАЦИЯ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14;margin:0\">«Для вашего формата предлагаю сытный фуршет: четыре вида холодных закусок, две горячие позиции и порционные десерты. Гости смогут есть стоя, поэтому в меню не будет блюд, для которых нужны нож и полноценная сервировка. Вегетарианские позиции вынесем на отдельную линию и подпишем. В стоимость входят доставка, посуда и работа двух официантов. Итоговая стоимость — 196 000 рублей».<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.55;color:#6E6A60;margin:0 0 18px\">Здесь каждая часть предложения связана с условиями, которые назвал клиент.<\u002Fp>\n\n  <div style=\"break-inside:avoid;background:#2A1A12;border-radius:16px;padding:20px 22px;margin:0\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#C9A88F;margin:0 0 10px\">ГЛАВНОЕ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.5;color:#F4EDE4;margin:0\">После презентации не следует продолжать перечислять преимущества на случай, если «что-нибудь еще сработает». Лишние аргументы перегружают сообщение и могут породить новые сомнения.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 07<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">попытка сделки<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Презентация не завершает продажу<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 16px\">После презентации менеджер должен предложить конкретное действие. Вопрос «Что скажете?» слишком широкий: клиенту приходится самому придумывать, что делать дальше.<\u002Fp>\n\n  <div style=\"break-inside:avoid;border:1px solid #E6CDC3;background:#FBF1EC;border-radius:14px;padding:16px 18px;margin:0 0 16px\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#A8401F;margin:0 0 8px\">✕ СЛИШКОМ ШИРОКО<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#3A2C26;margin:0\">«Что скажете?»<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 18px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n      <span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#5A3826\"><\u002Fspan>\n      <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#8A857A\">ОБОЗНАЧЕННЫЙ СЛЕДУЮЩИЙ ШАГ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:92%;background:#3A2318;border:1px solid #3A2318;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#C9A88F;margin:0 0 6px\">МЕНЕДЖЕР · ОФОРМЛЕНИЕ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#FFFFFF\">Если этот вариант вам подходит, я могу сегодня зафиксировать дату и отправить договор. Для бронирования потребуется предоплата 30%. Оформляем?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:92%;background:#3A2318;border:1px solid #3A2318;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#C9A88F;margin:0 0 6px\">МЕНЕДЖЕР · ВЫБОР ИЗ ДВУХ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#FFFFFF\">Какой вариант зафиксировать в расчете: базовый без официантов или полный с обслуживанием?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 14px\">Попытка сделки должна соответствовать стадии готовности клиента. Иногда мы продаем не весь заказ, а следующий шаг:<\u002Fp>\n\n  <div style=\"break-inside:avoid;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0\">\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Замер<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Встреча<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Пробная услуга<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Расчет<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#F7F4EE;border:1px solid #E2DCCE;border-radius:12px;padding:14px 16px;grid-column:1 / -1\"><span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;color:#22242A;line-height:1.3\">Согласование технического задания<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 08<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">работа с сомнениями<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 18px\">Техника отработки<\u002Fh2>\n\n  <div style=\"break-inside:avoid;display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:10px;margin:0 0 20px\">\n    <div style=\"display:flex;gap:18px;align-items:flex-start;background:#F7F4EE;border:2px solid #2A1A12;border-radius:14px;padding:16px 18px\">\n      \n      <div><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#22242A;margin:0 0 4px\">Присоединение<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.4;color:#5A554D\">Признаем логику вопроса клиента. Это не формальное «я вас понимаю» и не автоматическое согласие<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;align-items:flex-start;background:#F7F4EE;border:2px solid #2A1A12;border-radius:14px;padding:16px 18px\">\n      \n      <div><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#22242A;margin:0 0 4px\">Аргументация<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.4;color:#5A554D\">Отвечаем именно на названное сомнение, а не повторяем всю презентацию<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;align-items:flex-start;background:#F7F4EE;border:2px solid #2A1A12;border-radius:14px;padding:16px 18px\">\n      \n      <div><div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;color:#22242A;margin:0 0 4px\">Попытка сделки<\u002Fdiv><div style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.4;color:#5A554D\">После ответа снова предлагаем конкретное действие<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 16px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n      <span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#5A3826\"><\u002Fspan>\n      <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#8A857A\">ВОЗРАЖЕНИЕ «ДОРОГО»<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:86%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">196 тысяч — дороже, чем мы рассчитывали.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР&nbsp;<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Понимаю, исходя из вашей задачи-максимально сытно-это наиболее подходящий вариант. Основную стоимость создают горячие блюда и работа официантов. Чтобы сохранить сытный формат, можем убрать одну горячую позицию и оставить одного сотрудника на выкладку. Тогда сумма составит 144 000 рублей. Исправить договор под этот вариант?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0\">Менеджер не спорит с ощущением дороговизны. Он показывает причину цены, предлагает осмысленное изменение и повторяет попытку сделки.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЧАСТНЫЙ СЛУЧАЙ<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">«я подумаю»<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Если клиент пишет «я подумаю»<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 16px\">Эта фраза не объясняет, что именно мешает принять решение. Возможно, клиент сравнивает цены, согласовывает бюджет, сомневается в формате или просто не хочет продолжать разговор. Не нужно немедленно присылать новые аргументы — сначала уточните предмет размышления.<\u002Fp>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 16px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Конечно. Чтобы я не перегружал вас лишней информацией, подскажите, пожалуйста, что именно хотите обдумать: стоимость, состав меню или сам формат мероприятия?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:86%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">Не уверен, что нам нужны официанты.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#EDE1D6;border:1px solid #D8C3B0;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#7A5340;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14\">Тогда имеет смысл сравнить два варианта. Без официантов стоимость будет ниже на 18 000 рублей, но выкладку и уборку столов должен будет контролировать кто-то с вашей стороны. С одним сотрудником мы возьмем это на себя. Какой вариант заложить в итоговый расчет?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 16px\">Если клиент не хочет обсуждать сомнение, давить не нужно:<\u002Fp>\n\n  <div style=\"break-inside:avoid;border:1px solid #DCC9B8;background:#F3E9E0;border-radius:14px;padding:16px 18px;margin:0\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#5A3826;margin:0 0 8px\">✓ БЕЗ ДАВЛЕНИЯ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#2E1C14;margin:0\">«Хорошо. Когда вам будет удобно вернуться к решению? Я напишу в согласованный день и уточню, актуальна ли еще дата».<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ЭТАП 09<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">повторная попытка сделки<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">После ответа продажа не заканчивается<\u002Fh2>\n\n  <div style=\"background:#F4F1EA;border:1px solid #E2DCCE;border-radius:18px;padding:18px;margin:0 0 16px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-start\">\n        <div style=\"max-width:86%;background:#FFFFFF;border:1px solid #E5E0D4;border-radius:18px 18px 18px 6px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#9A9488;margin:0 0 6px\">КЛИЕНТ<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#22242A\">А если гостей окажется не семьдесят, а шестьдесят?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside:avoid;display:flex;justify-content:flex-end\">\n        <div style=\"max-width:94%;background:#3A2318;border:1px solid #3A2318;border-radius:18px 18px 6px 18px;padding:12px 16px\">\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#C9A88F;margin:0 0 6px\">МЕНЕДЖЕР<\u002Fdiv>\n          <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#FFFFFF\">Количество можно скорректировать за пять дней до мероприятия, и итоговая сумма уменьшится пропорционально. Тогда сейчас зафиксируем дату на семьдесят гостей, а окончательное количество подтвердим за пять дней. Отправить договор на бронирование?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid;border:1px solid #E6CDC3;background:#FBF1EC;border-radius:14px;padding:16px 18px;margin:0 0 8px\">\n    <div style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.04em;color:#A8401F;margin:0 0 8px\">✕ ДИАЛОГ ЗАВИСАЕТ<\u002Fdiv>\n    <p style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;line-height:1.45;color:#3A2C26;margin:0\">«Да, можно уменьшить».<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.55;color:#6E6A60;margin:0\">Информация предоставлена, но клиенту не показан следующий шаг.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"break-before:page\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-top:2px solid #2A1A12;padding-top:10px;margin:0 0 14px\">\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;font-weight:700;letter-spacing:0.05em;color:#5A3826\">ПОСЛЕ ДИАЛОГА<\u002Fspan>\n    <span style=\"overflow-wrap:break-word;font-family:Onest,sans-serif;font-size:20pt;letter-spacing:0.03em;color:#9A9488\">касания<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-family:Onest,sans-serif;font-size:30pt;line-height:1.15;font-weight:800;letter-spacing:-0.02em;color:#2A1A12;margin:0 0 16px\">Касания после переписки<\u002Fh2>\n\n  <p style=\"overflow-wrap:break-word;font-family:Literata,Georgia,serif;font-size:20pt;line-height:1.6;color:#22242A;margin:0 0 18
